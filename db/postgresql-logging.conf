# FR-09: log every statement together with its bind parameters.
# jsonlog = one JSON object per line, so multi-line SQL is trivial to parse in a stream.
logging_collector = on
log_destination = 'jsonlog'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql.log'          # -> postgresql.json for jsonlog
log_file_mode = 0644                     # collector runs as another uid and only needs read access
log_rotation_age = 0                     # single growing file; the collector also handles truncation
log_rotation_size = 0
log_statement = 'all'
log_parameter_max_length = -1            # log full parameter values (the user inputs we analyze)
log_parameter_max_length_on_error = -1
log_min_error_statement = error
log_timezone = 'UTC'
